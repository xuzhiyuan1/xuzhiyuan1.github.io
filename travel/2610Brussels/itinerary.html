<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>全部行程 · 布鲁塞尔 · 巴黎 · 阿姆斯特丹</title>
<link rel="stylesheet" href="ui/style.css" />
</head>
<body class="pg-itin" data-page="itin">
<img class="durbg" src="ui/theme.png" alt="" aria-hidden="true">
<div class="hero">
  <div class="wrap">
    <a class="back" href="index.html">← 返回日程</a>
    <h1>📋 全部行程 <img class="dur" src="ui/theme.png" alt="华夫饼"></h1>

  </div>
</div>
<div class="wrap">
  <!-- 下拉刷新指示条：移动端下拉手势 / 桌面端鼠标下拉或点击，显示"数据最新改动时间" -->
  <div class="pullBanner" id="pullBanner">
    <div class="pullSpacer" id="pullSpacer"></div>
    <div class="pullRow" id="pullRow" role="button" tabindex="0" aria-label="下拉或点击刷新数据">
      <span class="pullIcon" id="pullIcon">⌄</span>
      <span class="pullStatus" id="pullStatus">下拉刷新</span>
      <span class="pullDot">·</span>
      <span class="pullTime" id="pullTime">加载中…</span>
    </div>
  </div>

  <div class="legend">
    <span class="lg"><span class="sw" style="background:#9aa7ae"></span>已完成</span>
    <span class="lg"><span class="sw" style="background:#c2410c"></span>当前 / 下一步</span>
    <span class="lg"><span class="sw" style="background:#e8d3b6"></span>未开始</span>
  </div>
  <div id="days"></div>
  <footer><a href="index.html">返回日程首页</a></footer>
</div>

<img class="princeFab" id="princeFab" src="ui/prince.png" alt="小王子" title="点我告诉小王子想怎么改行程">
